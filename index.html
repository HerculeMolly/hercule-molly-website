<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hercule Molly | Handcrafted Woodcraft</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #222; background: #fdfdfd; line-height: 1.5; padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
    header { text-align: center; padding: 2rem 0 1rem; border-bottom: 1px solid #eee; }
    h1 { font-size: 2rem; letter-spacing: 0.05em; text-transform: uppercase; }
    .hero-banner { background: #f4f1ea; padding: 1.25rem; border-radius: 6px; text-align: center; margin: 1.5rem 0 2.5rem; }
    .hero-banner p { font-size: 1rem; color: #444; font-weight: 5rem; }
    
    /* Responsive Grid: 2 cols on mobile, 3 cols on tablet, 4 cols on desktop */
    .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; }
    @media (min-width: 600px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 900px) { .product-grid { grid-template-columns: repeat(4, 1fr); } }
    
    .card { border: 1px solid #e5e5e5; border-radius: 6px; overflow: hidden; background: #fff; display: flex; flex-direction: column; justify: space-between; }
    .card img { width: 100%; height: 180px; object-fit: cover; background: #eee; }
    .card-body { padding: 1rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem; }
    .wood-tag { font-size: 0.8rem; color: #6b5b4b; background: #f0ebd9; display: inline-block; padding: 0.2rem 0.5rem; border-radius: 3px; margin-bottom: 0.75rem; width: fit-content; }
    .price { font-size: 1.1rem; font-weight: 700; color: #111; margin-bottom: 0.75rem; }
    .btn-buy { width: 100%; background: #2b2b2b; color: #fff; border: none; padding: 0.6rem; font-size: 0.9rem; font-weight: 600; border-radius: 4px; cursor: pointer; text-align: center; text-decoration: none; display: block; }
    .btn-buy:hover { background: #444; }
  </style>
</head>
<body>

  <header>
    <h1>Hercule Molly</h1>
  </header>

  <section class="hero-banner">
    <p>Handcrafted woodcraft made exclusively from patient, air-dried timber and rescued architectural hardwoods.</p>
  </section>

  <main class="product-grid" id="grid"></main>

  <script>
    // Reads your LibreOffice products.csv file automatically
    Papa.parse("products.csv", {
      download: true,
      header: true,
      complete: function(results) {
        const grid = document.getElementById('grid');
        results.data.forEach(item => {
          if (item.name && item.category_status === 'Active') {
            const card = `
              <div class="card">
                <img src="${item.image}" alt="${item.name}">
                <div class="card-body">
                  <div>
                    <h2 class="card-title">${item.name}</h2>
                    <span class="wood-tag">${item.wood_origin}</span>
                  </div>
                  <div>
                    <div class="price">£${item.price}</div>
                    <button class="btn-buy" onclick="alert('Checkout process initializing for ${item.name}')">Buy Now</button>
                  </div>
                </div>
              </div>
            `;
            grid.innerHTML += card;
          }
        });
      }
    });
  </script>

</body>
</html>
