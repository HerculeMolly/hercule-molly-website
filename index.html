<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hercule Molly - Quality Woodcraft Gifts</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary: #0f172a;
      --primary-hover: #334155;
      --accent: #b45309;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 2px 0;
      font-size: 1.4rem;
      letter-spacing: -0.025em;
      color: var(--primary);
    }

    header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    main {
      max-width: 1300px;
      margin: 0 auto;
      padding: 8px 6px;
    }

    /* Responsive Grid: 2 cols on mobile/mini, 3 on tablet, 4 on laptop */
    #product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    @media (min-width: 640px) {
      #product-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      main {
        padding: 16px;
      }
    }

    @media (min-width: 1024px) {
      #product-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
      }
    }

    .product-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px;
      background: var(--card-bg);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    @media (min-width: 640px) {
      .product-card {
        padding: 10px;
        border-radius: 8px;
      }
    }

    /* 1:1 Square Ratio Box */
    .img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 4px;
      margin-bottom: 4px;
      background-color: #f1f5f9;
      cursor: pointer;
      position: relative;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s ease;
    }

    .img-wrapper:hover img {
      transform: scale(1.02);
    }

    /* Fixed-height title block to lock grid alignment */
    .card-body h3 {
      margin: 0 0 2px 0;
      font-size: 0.85rem;
      color: var(--primary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      height: 2.5em; 
    }

    @media (min-width: 640px) {
      .card-body h3 {
        font-size: 1rem;
      }
    }

    /* Option Container with Fixed Height to Lock Alignment */
    .pill-container {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin: 4px 0;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 4px 0;
      min-height: 52px;
      align-content: flex-start;
    }

    .pill-option {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 6px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--text-color);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
      flex-grow: 1;
      justify-content: center;
      text-align: center;
      height: 22px;
      box-sizing: border-box;
    }

    @media (min-width: 640px) {
      .pill-option {
        font-size: 0.78rem;
        padding: 4px 8px;
        height: 24px;
      }
    }

    .pill-option input[type="checkbox"] {
      display: none;
    }

    .pill-price {
      color: var(--accent);
      font-weight: 700;
    }

    .pill-option.selected {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      font-weight: 600;
    }

    .pill-option.selected .pill-price {
      color: #ffffff;
    }

    .pill-option.out-of-stock {
      opacity: 0.35;
      cursor: not-allowed;
      background: #e2e8f0;
    }

    /* Static Price Pill in Position 1 */
    .pill-static-price {
      display: inline-flex;
      align-items: center;
      padding: 3px 6px;
      background: #fef3c7;
      border: 1px solid #fde68a;
      border-radius: 4px;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--accent);
      flex-grow: 1;
      justify-content: center;
      text-align: center;
      height: 22px;
      box-sizing: border-box;
    }

    @media (min-width: 640px) {
      .pill-static-price {
        font-size: 0.78rem;
        padding: 4px 8px;
        height: 24px;
      }
    }

    /* Variant List Container with fixed height matching pill-container */
    .variant-list-container {
      margin: 4px 0;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 4px 0;
      min-height: 52px;
      box-sizing: border-box;
    }

    .variant-header-row {
      display: flex;
      justify-content: flex-end;
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
      padding-right: 2px;
    }

    .variant-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      text-align: left;
    }

    .variant-option {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    @media (min-width: 640px) {
      .variant-option {
        font-size: 0.85rem;
        gap: 8px;
      }
    }

    .variant-option.out-of-stock {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .variant-stock {
      margin-left: auto;
      color: var(--text-muted);
      font-size: 0.7rem;
    }

    /* Fixed Card Footer Alignment */
    .card-footer {
      margin-top: auto;
      padding-top: 4px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    @media (min-width: 640px) {
      button {
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 0.85rem;
      }
    }

    button:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    button:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }

    /* Modal Popup Styling */
    #modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    #modal-content {
      background: var(--card-bg);
      border-radius: 8px;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    #modal-close {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--text-muted);
      cursor: pointer;
      width: auto;
      padding: 0;
    }

    .modal-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    #loading {
      text-align: center;
      grid-column: 1 / -1;
      color: var(--text-muted);
      padding: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Hercule Molly</h1>
    <p>Quality Woodcraft Gifts</p>
  </header>

  <main>
    <div id="product-grid">
      <div id="loading">Loading catalog...</div>
    </div>
  </main>

  <!-- Product Detail Modal -->
  <div id="modal-overlay" onclick="closeModal(event)">
    <div id="modal-content" onclick="event.stopPropagation()">
      <button id="modal-close" onclick="closeModal()">×</button>
      <img id="modal-img" class="modal-img" src="" alt="" />
      <h2 id="modal-title" style="margin: 0 0 6px 0; font-size: 1.2rem; color: var(--primary);"></h2>
      <p id="modal-wood" class="wood-type" style="margin-bottom: 8px; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase;"></p>
      <p id="modal-price" class="price" style="margin-bottom: 12px;"></p>
      <p id="modal-desc" style="font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; margin: 0;"></p>
    </div>
  </div>

  <script>
    let allProducts = [];

    async function loadProducts() {
      try {
        const response = await fetch('products.csv');
        const csvText = await response.text();
        allProducts = parseCSV(csvText);
        renderProducts(allProducts);
      } catch (error) {
        console.error('Error loading products.csv:', error);
        document.getElementById('product-grid').innerHTML = '<p style="text-align: center; color: red;">Could not load products. Please check products.csv format.</p>';
      }
    }

    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const headers = lines[0].split(',').map(h => h.trim());
      const result = [];

      for (let i = 1; i < lines.length; i++) {
        const currentLine = lines[i].trim();
        if (!currentLine) continue;

        const values = [];
        let inQuote = false;
        let currentValue = '';
        
        for (let char of currentLine) {
          if (char === '"') {
            inQuote = !inQuote;
          } else if (char === ',' && !inQuote) {
            values.push(currentValue.trim());
            currentValue = '';
          } else {
            currentValue += char;
          }
        }
        values.push(currentValue.trim());

        const item = {};
        headers.forEach((header, index) => {
          item[header] = values[index] !== undefined ? values[index].replace(/^"|"$/g, '') : '';
        });
        result.push(item);
      }
      return result;
    }

    function renderProducts(products) {
      const container = document.getElementById('product-grid');
      container.innerHTML = '';

      const grouped = {};
      products.forEach(item => {
        if (item.status && item.status.toLowerCase() === 'draft') return;

        const key = item.group_id && item.group_id.trim() !== '' ? item.group_id : item.id;
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(item);
      });

      Object.keys(grouped).forEach(key => {
        const items = grouped[key];
        const isGrouped = items.length > 1;
        const card = document.createElement('div');
        card.className = 'product-card';

        const mainDesc = items[0].desc;
        const mainImage = items[0].image;
        const mainWood = items[0].wood || '';
        const mainLongDesc = items[0].long_desc || 'Handcrafted quality woodcraft gift.';

        if (!isGrouped) {
          // --- STANDALONE ITEM ---
          const p = items[0];
          const stockCount = parseInt(p.stock) || 0;
          const isOut = stockCount <= 0;
          const itemLongDesc = p.long_desc || 'Handcrafted quality woodcraft gift.';
          const woodLabel = p.wood ? p.wood : 'Standard';

          card.innerHTML = `
            <div>
              <div class="img-wrapper" onclick="openModal('${p.image}', '${p.desc.replace(/'/g, "\\'")}', '${p.wood || ''}', '£${parseFloat(p.price).toFixed(2)}', '${itemLongDesc.replace(/'/g, "\\'")}')">
                <img src="${p.image}" alt="${p.desc}" />
              </div>
              <div class="card-body">
                <h3>${p.desc}</h3>
                <div class="pill-container">
                  <label class="pill-option ${isOut ? 'out-of-stock' : ''}">
                    <input type="checkbox" 
                           name="group-${key}" 
                           value="${p.id}" 
                           data-price="${p.price}" 
                           ${isOut ? 'disabled' : ''} 
                           onchange="togglePill(this, '${key}')">
                    <span>${woodLabel}</span> <span class="pill-price">£${parseFloat(p.price).toFixed(2)}</span>
                  </label>
                </div>
              </div>
            </div>
            <div class="card-footer">
              <button id="btn-${key}" disabled>${isOut ? 'Sold Out' : 'Add Selection'}</button>
            </div>
          `;
        } else {
          // --- GROUPED BOX ---
          const layoutType = items[0].layout ? items[0].layout.toLowerCase() : 'collection';
          const firstPrice = parseFloat(items[0].price);
          const pricesAllSame = items.every(i => parseFloat(i.price) === firstPrice);

          let innerOptionsHTML = '';

          if (layoutType === 'collection') {
            innerOptionsHTML = '<div class="pill-container">';
            
            // First Pill: Static "Price Each" if all prices match
            if (pricesAllSame) {
              innerOptionsHTML += `<div class="pill-static-price">£${firstPrice.toFixed(2)} each</div>`;
            }

            items.forEach(item => {
              const stockCount = parseInt(item.stock) || 0;
              const disabled = stockCount <= 0;
              const labelBase = item.short_name ? item.short_name : (item.wood ? item.wood : item.id);
              
              const labelHTML = pricesAllSame 
                ? `<span>${labelBase}</span>` 
                : `<span>${labelBase}</span> <span class="pill-price">£${parseFloat(item.price).toFixed(2)}</span>`;

              innerOptionsHTML += `
                <label class="pill-option ${disabled ? 'out-of-stock' : ''}">
                  <input type="checkbox" 
                         name="group-${key}" 
                         value="${item.id}" 
                         data-price="${item.price}" 
                         ${disabled ? 'disabled' : ''} 
                         onchange="togglePill(this, '${key}')">
                  ${labelHTML}
                </label>
              `;
            });
            innerOptionsHTML += '</div>';
          } else {
            // --- VARIANT LIST ---
            innerOptionsHTML = `
              <div class="variant-list-container">
                <div class="variant-header-row">
                  <span>Stock</span>
                </div>
                <div class="variant-list">
            `;
            items.forEach(item => {
              const stockCount = parseInt(item.stock) || 0;
              const disabled = stockCount <= 0;
              const woodLabel = item.wood ? item.wood : item.desc;
              const formattedPrice = parseFloat(item.price).toFixed(2);
              const priceTag = pricesAllSame ? '' : ` — <strong style="color: var(--accent);">£${formattedPrice}</strong>`;

              innerOptionsHTML += `
                <label class="variant-option ${disabled ? 'out-of-stock' : ''}">
                  <input type="checkbox" 
                         name="group-${key}" 
                         value="${item.id}" 
                         data-price="${item.price}" 
                         ${disabled ? 'disabled' : ''} 
                         onchange="updateGroupButton('${key}')">
                  <span><strong>${item.id}</strong> — ${woodLabel}${priceTag}</span>
                  <span class="variant-stock">${disabled ? '0' : stockCount}</span>
                </label>
              `;
            });
            innerOptionsHTML += `</div></div>`;
          }

          const displayPriceStr = pricesAllSame ? `£${firstPrice.toFixed(2)}` : 'Various Prices';

          card.innerHTML = `
            <div>
              <div class="img-wrapper" onclick="openModal('${mainImage}', '${mainDesc.replace(/'/g, "\\'")}', '${mainWood}', '${displayPriceStr}', '${mainLongDesc.replace(/'/g, "\\'")}')">
                <img src="${mainImage}" alt="${mainDesc}" />
              </div>
              <div class="card-body">
                <h3>${mainDesc}</h3>
                ${innerOptionsHTML}
              </div>
            </div>
            <div class="card-footer">
              <button id="btn-${key}" disabled>Add Selection</button>
            </div>
          `;
        }

        container.appendChild(card);
      });
    }

    function togglePill(checkbox, groupKey) {
      const label = checkbox.closest('.pill-option');
      if (checkbox.checked) {
        label.classList.add('selected');
      } else {
        label.classList.remove('selected');
      }
      updateGroupButton(groupKey);
    }

    function updateGroupButton(groupKey) {
      const checkboxes = document.querySelectorAll(`input[name="group-${groupKey}"]:checked`);
      const btnEl = document.getElementById(`btn-${groupKey}`);
      btnEl.disabled = checkboxes.length === 0;
    }

    function openModal(img, title, wood, price, desc) {
      document.getElementById('modal-img').src = img;
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-wood').innerText = wood;
      document.getElementById('modal-price').innerText = price;
      document.getElementById('modal-desc').innerText = desc;
      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }

    loadProducts();
  </script>
</body>
</html>
