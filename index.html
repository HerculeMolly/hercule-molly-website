<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hercule Molly - Quality Woodcraft Gifts</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary: #0f172a;
      --primary-hover: #334155;
      --accent: #b45309;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 20px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 4px 0;
      font-size: 1.6rem;
      letter-spacing: -0.025em;
      color: var(--primary);
    }

    header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    main {
      max-width: 1300px;
      margin: 0 auto;
      padding: 16px 8px;
    }

    /* Responsive Grid: 2 cols on mobile, 3 on tablet, 4 on laptop */
    #product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (min-width: 640px) {
      #product-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      main {
        padding: 24px 16px;
      }
    }

    @media (min-width: 1024px) {
      #product-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
      }
    }

    .product-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      background: var(--card-bg);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    @media (min-width: 640px) {
      .product-card {
        padding: 14px;
        border-radius: 8px;
      }
    }

    /* Strict 4:3 Portrait Ratio Box */
    .img-wrapper {
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      border-radius: 4px;
      margin-bottom: 8px;
      background-color: #f1f5f9;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body h3 {
      margin: 0 0 2px 0;
      font-size: 0.95rem;
      color: var(--primary);
    }

    @media (min-width: 640px) {
      .card-body h3 {
        font-size: 1.1rem;
      }
    }

    .wood-type {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin: 0 0 6px 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .price {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--accent);
      margin: 0 0 6px 0;
    }

    .price-header {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--accent);
      margin: 2px 0 8px 0;
    }

    /* Collection Tap-to-Toggle Pill Grid */
    .pill-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 0;
    }

    .pill-option {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-color);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .pill-option input[type="checkbox"] {
      display: none;
    }

    .pill-option.selected {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      font-weight: 600;
    }

    .pill-option.out-of-stock {
      opacity: 0.35;
      cursor: not-allowed;
      background: #e2e8f0;
    }

    /* Variant List for multi-price or detailed items */
    .variant-list-container {
      margin: 8px 0;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 6px 0;
    }

    .variant-header-row {
      display: flex;
      justify-content: flex-end;
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      padding-right: 2px;
    }

    .variant-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      text-align: left;
    }

    .variant-option {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    @media (min-width: 640px) {
      .variant-option {
        font-size: 0.85rem;
        gap: 8px;
      }
    }

    .variant-option.out-of-stock {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .variant-stock {
      margin-left: auto;
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 8px;
    }

    .group-total {
      font-weight: 600;
      font-size: 0.9rem;
      margin: 0 0 6px 0;
      color: var(--primary);
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    @media (min-width: 640px) {
      button {
        padding: 10px 16px;
        border-radius: 6px;
        font-size: 0.9rem;
      }
    }

    button:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    button:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }

    #loading {
      text-align: center;
      grid-column: 1 / -1;
      color: var(--text-muted);
      padding: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Hercule Molly</h1>
    <p>Quality Woodcraft Gifts</p>
  </header>

  <main>
    <div id="product-grid">
      <div id="loading">Loading catalog...</div>
    </div>
  </main>

  <script>
    async function loadProducts() {
      try {
        const response = await fetch('products.csv');
        const csvText = await response.text();
        const products = parseCSV(csvText);
        renderProducts(products);
      } catch (error) {
        console.error('Error loading products.csv:', error);
        document.getElementById('product-grid').innerHTML = '<p style="text-align: center; color: red;">Could not load products. Please check products.csv format.</p>';
      }
    }

    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const headers = lines[0].split(',').map(h => h.trim());
      const result = [];

      for (let i = 1; i < lines.length; i++) {
        const currentLine = lines[i].trim();
        if (!currentLine) continue;

        const values = currentLine.split(',').map(val => val.trim());
        const item = {};
        headers.forEach((header, index) => {
          item[header] = values[index] !== undefined ? values[index] : '';
        });
        result.push(item);
      }
      return result;
    }

    function renderProducts(products) {
      const container = document.getElementById('product-grid');
      container.innerHTML = '';

      const grouped = {};
      products.forEach(item => {
        if (item.status && item.status.toLowerCase() === 'draft') return;

        const key = item.group_id && item.group_id.trim() !== '' ? item.group_id : item.id;
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(item);
      });

      Object.keys(grouped).forEach(key => {
        const items = grouped[key];
        const isGrouped = items.length > 1;
        const card = document.createElement('div');
        card.className = 'product-card';

        if (!isGrouped) {
          // --- STANDALONE ITEM ---
          const p = items[0];
          const stockCount = parseInt(p.stock) || 0;
          const isOut = stockCount <= 0;

          card.innerHTML = `
            <div>
              <div class="img-wrapper">
                <img src="${p.image}" alt="${p.desc}" />
              </div>
              <div class="card-body">
                <h3>${p.desc}</h3>
                <p class="wood-type">${p.wood || ''}</p>
                <p class="price">£${parseFloat(p.price).toFixed(2)}</p>
              </div>
            </div>
            <div class="card-footer">
              <button ${isOut ? 'disabled' : ''}>${isOut ? 'Sold Out' : 'Buy Now'}</button>
            </div>
          `;
        } else {
          // --- GROUPED BOX ---
          const mainDesc = items[0].desc;
          const mainImage = items[0].image;
          const layoutType = items[0].layout ? items[0].layout.toLowerCase() : 'collection';

          const firstPrice = parseFloat(items[0].price);
          const pricesAllSame = items.every(i => parseFloat(i.price) === firstPrice);

          let priceHeader = pricesAllSame 
            ? `<p class="price-header">£${firstPrice.toFixed(2)} each</p>` 
            : '';

          let innerOptionsHTML = '';

          if (layoutType === 'collection') {
            // --- LAYOUT TYPE 1: COLLECTION (Compact Tap-to-Toggle Pills) ---
            innerOptionsHTML = '<div class="pill-container">';
            items.forEach(item => {
              const stockCount = parseInt(item.stock) || 0;
              const disabled = stockCount <= 0;
              const pillLabel = item.short_name ? item.short_name : (item.wood ? item.wood : item.id);

              innerOptionsHTML += `
                <label class="pill-option ${disabled ? 'out-of-stock' : ''}">
                  <input type="checkbox" 
                         name="group-${key}" 
                         value="${item.id}" 
                         data-price="${item.price}" 
                         ${disabled ? 'disabled' : ''} 
                         onchange="togglePill(this, '${key}')">
                  <span>${pillLabel}</span>
                </label>
              `;
            });
            innerOptionsHTML += '</div>';
          } else {
            // --- LAYOUT TYPE 2: VARIANT LIST (Wood options with varying prices) ---
            innerOptionsHTML = `
              <div class="variant-list-container">
                <div class="variant-header-row">
                  <span>Stock</span>
                </div>
                <div class="variant-list">
            `;
            items.forEach(item => {
              const stockCount = parseInt(item.stock) || 0;
              const disabled = stockCount <= 0;
              const woodLabel = item.wood ? item.wood : item.desc;
              const formattedPrice = parseFloat(item.price).toFixed(2);
              const priceTag = pricesAllSame ? '' : ` — <strong>£${formattedPrice}</strong>`;

              innerOptionsHTML += `
                <label class="variant-option ${disabled ? 'out-of-stock' : ''}">
                  <input type="checkbox" 
                         name="group-${key}" 
                         value="${item.id}" 
                         data-price="${item.price}" 
                         ${disabled ? 'disabled' : ''} 
                         onchange="updateGroupTotal('${key}')">
                  <span><strong>${item.id}</strong> — ${woodLabel}${priceTag}</span>
                  <span class="variant-stock">${disabled ? '0' : stockCount}</span>
                </label>
              `;
            });
            innerOptionsHTML += `</div></div>`;
          }

          card.innerHTML = `
            <div>
              <div class="img-wrapper">
                <img src="${mainImage}" alt="${mainDesc}" />
              </div>
              <div class="card-body">
                <h3>${mainDesc}</h3>
                ${priceHeader}
                ${innerOptionsHTML}
              </div>
            </div>
            <div class="card-footer">
              <p class="group-total" id="total-${key}">Total: £0.00</p>
              <button id="btn-${key}" disabled>Add Selected to Order</button>
            </div>
          `;
        }

        container.appendChild(card);
      });
    }

    function togglePill(checkbox, groupKey) {
      const label = checkbox.closest('.pill-option');
      if (checkbox.checked) {
        label.classList.add('selected');
      } else {
        label.classList.remove('selected');
      }
      updateGroupTotal(groupKey);
    }

    function updateGroupTotal(groupKey) {
      const checkboxes = document.querySelectorAll(`input[name="group-${groupKey}"]:checked`);
      let total = 0;
      checkboxes.forEach(cb => {
        total += parseFloat(cb.getAttribute('data-price'));
      });

      const totalEl = document.getElementById(`total-${groupKey}`);
      const btnEl = document.getElementById(`btn-${groupKey}`);

      totalEl.innerText = `Total: £${total.toFixed(2)}`;
      btnEl.disabled = checkboxes.length === 0;
    }

    loadProducts();
  </script>
</body>
</html>
